name: Windows x64 installer

on:
  workflow_dispatch:
    inputs:
      cpu_profile:
        description: CPU build profile (multi recommended)
        type: choice
        options: [multi, baseline]
        default: multi
      offline_webview2:
        description: Bundle the WebView2 offline installer (model weights remain separate)
        type: boolean
        default: false
  push:
    tags: ['v*']
    # Caches saved by a tag run are visible only to that tag. Build on main when the
    # compiled inputs change, so every later release tag can restore main's caches.
    branches: [main]
    paths:
      - .github/workflows/windows-x64.yml
      - app/scripts/build-native.ps1
      - app/scripts/windows/Windows-Common.ps1
      - '**/Cargo.lock'

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}-${{ inputs.cpu_profile || 'multi' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: x64
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      # The SDK compiles the Vulkan GPU backend. Lavapipe is Mesa's software Vulkan device: the
      # runner has no GPU, so it is how CI proves the packaged Vulkan backend really transcribes.
      # Neither is packaged; users' GPU drivers provide Vulkan.
      - name: Install the Vulkan SDK and a software Vulkan device
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: 1.4.357.0
          install_runtime: true
          install_lavapipe: true
          cache: true
      - name: Cache fetched llama.cpp source
        uses: actions/cache@v4
        with:
          path: app/.native-build/source/llama
          key: windows-x64-llama-source-${{ hashFiles('app/scripts/windows/Windows-Common.ps1') }}
      # build-native.ps1 reuses these binaries only if their stamp matches the llama.cpp
      # commit and every CMake option; otherwise it rebuilds. The inference test below
      # still loads the packaged runtime and transcribes real speech on every run.
      - name: Restore compiled llama.cpp runtime
        id: llama-bin
        uses: actions/cache/restore@v4
        with:
          path: app/.native-build/windows-x64-${{ inputs.cpu_profile || 'multi' }}-msvc/bin/Release
          key: windows-x64-llama-bin-${{ inputs.cpu_profile || 'multi' }}-${{ hashFiles('app/scripts/build-native.ps1', 'app/scripts/windows/Windows-Common.ps1') }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-x64-rust192
          workspaces: |
            app/src-tauri
            app/native/windows-loopback
            spikes/domain-rs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Parse all build scripts before running them
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem app/scripts,app/native -Filter *.ps1 -Recurse)
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw "$($file.FullName): $($errors | Out-String)" }
          }
      - name: Build, test and collect the unsigned x64 installer
        env:
          CPU_PROFILE: ${{ inputs.cpu_profile || 'multi' }}
          OFFLINE_WEBVIEW2: ${{ inputs.offline_webview2 || false }}
        run: |
          ./app/scripts/windows/Build-Windows.ps1 -CpuProfile $env:CPU_PROFILE -Jobs 2 -OfflineWebView2:($env:OFFLINE_WEBVIEW2 -eq 'true')
      # Saved as soon as it is built, so a failing test later in the job does not throw away a
      # 30-minute Vulkan compile.
      - name: Save compiled llama.cpp runtime
        if: ${{ always() && steps.llama-bin.outputs.cache-hit != 'true' && hashFiles(format('app/.native-build/windows-x64-{0}-msvc/bin/Release/llama-server.exe', inputs.cpu_profile || 'multi')) != '' }}
        uses: actions/cache/save@v4
        with:
          path: app/.native-build/windows-x64-${{ inputs.cpu_profile || 'multi' }}-msvc/bin/Release
          key: ${{ steps.llama-bin.outputs.cache-primary-key }}
      - name: Load the packaged model runtime and transcribe real speech
        run: |
          $output = Get-ChildItem .windows-output -Directory | Sort-Object Name | Select-Object -Last 1
          ./app/scripts/windows/Test-QwenInference.ps1 -NativeRoot app/src-tauri/resources/native -ModelDir "$env:RUNNER_TEMP\Qwen 模型" -Report (Join-Path $output.FullName 'QWEN-INFERENCE.json')
      - name: Diagnose Vulkan start-up flag combinations
        if: ${{ (inputs.cpu_profile || 'multi') == 'multi' }}
        continue-on-error: true
        run: |
          $env:PATH = "$env:VULKAN_SDK\runtime\x64;$env:VULKAN_SDK\Bin;$env:PATH"
          $env:GGML_VK_VISIBLE_DEVICES = '0'
          $server = Resolve-Path app/src-tauri/resources/native/qwen/llama-server.exe
          $model = Join-Path $env:RUNNER_TEMP 'Qwen 模型'
          $combos = @(@('-ngl','99'), @('-ngl','99','--no-host'), @('-ngl','99','--fit','off'), @('-ngl','99','--no-host','--fit','off'), @('-ngl','99','--no-host','--fit','off','--no-mmproj-offload'))
          foreach ($combo in $combos) {
            $log = Join-Path $env:RUNNER_TEMP 'diag.log'
            $args = @('-m',(Join-Path $model 'Qwen3-ASR-0.6B-Q8_0.gguf'),'--mmproj',(Join-Path $model 'mmproj-Qwen3-ASR-0.6B-Q8_0.gguf'),'--port','50999','--no-webui','--jinja','-c','4096','-np','1','--cache-ram','0','-lv','4') + $combo
            $p = Start-Process -FilePath $server -ArgumentList ($args | ForEach-Object { '"{0}"' -f $_ }) -RedirectStandardError $log -RedirectStandardOutput "$log.out" -PassThru -NoNewWindow
            $ok = $false
            for ($i = 0; $i -lt 90; $i++) { if ($p.HasExited) { break }; try { if ((Invoke-WebRequest http://127.0.0.1:50999/health -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break } } catch {}; Start-Sleep 1 }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; $p.WaitForExit() }
            Write-Host "=== $($combo -join ' ') => healthy=$ok"
            Get-Content $log, "$log.out" -ErrorAction SilentlyContinue | Select-String -Pattern 'ggml_vulkan|GGML_ASSERT|offload|fit|host|buffer|load_tensors|error' | Select-Object -First 25 | ForEach-Object { Write-Host "    $_" }
          }
      - name: Transcribe real speech on the packaged Vulkan GPU backend
        if: ${{ (inputs.cpu_profile || 'multi') == 'multi' }}
        run: |
          # Users get vulkan-1.dll from their GPU driver; the runner gets it from the SDK runtime.
          $env:PATH = "$env:VULKAN_SDK\runtime\x64;$env:VULKAN_SDK\Bin;$env:PATH"
          # llama.cpp skips CPU-type Vulkan devices unless named; lavapipe is one. Real users get
          # the default: a dedicated GPU, otherwise the integrated one.
          $env:GGML_VK_VISIBLE_DEVICES = '0'
          $info = Get-ChildItem "$env:VULKAN_SDK\Bin" -Filter 'vulkaninfo*.exe' | Select-Object -First 1
          if ($info) { & $info.FullName --summary }
          $output = Get-ChildItem .windows-output -Directory | Sort-Object Name | Select-Object -Last 1
          ./app/scripts/windows/Test-QwenInference.ps1 -NativeRoot app/src-tauri/resources/native -ModelDir "$env:RUNNER_TEMP\Qwen 模型" -Device gpu -RequireVulkan -Report (Join-Path $output.FullName 'QWEN-INFERENCE-vulkan.json')
      - name: Upgrade over LectureEdit 0.1.3 keeps course data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem .windows-output -Recurse -Filter 'Suitang_*_setup.exe' | Select-Object -First 1
          ./app/scripts/windows/Test-RenameUpgrade.ps1 -Installer $installer.FullName
      - name: Upload installer, hashes and exact build report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Suitang-windows-x64-${{ inputs.cpu_profile || 'multi' }}-${{ github.run_number }}
          path: .windows-output/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics even after a failed build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Suitang-windows-x64-diagnostics-${{ github.run_number }}
          path: |
            .windows-build/logs/**
            .windows-output/**/BUILD-INFO.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
