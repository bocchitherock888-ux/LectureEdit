name: Diagnose Windows Qwen startup
on:
  push:
    branches: ['diag/**']
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build native runtime
        run: ./app/scripts/build-native.ps1 -CpuProfile multi -Jobs 4
      - name: Load model and transcribe with packaged runtime
        run: ./app/scripts/windows/Test-QwenInference.ps1 -NativeRoot app/src-tauri/resources/native -ModelDir "$env:RUNNER_TEMP\qwen-model"
