name: Diagnose Windows Qwen startup
on:
  push:
    branches: ['diag/**']
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download released installer and extract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0 -R ${{ github.repository }} -p 'LectureEdit_0.1.0_windows-x64_multi_setup.exe' -D rel
          7z x rel\LectureEdit_0.1.0_windows-x64_multi_setup.exe -oinst -y | Out-Null
          Get-ChildItem inst -Recurse | Where-Object { $_.FullName -match 'native' } | ForEach-Object { $_.FullName }
      - name: Download model files
        run: |
          $r='https://huggingface.co/ggml-org/Qwen3-ASR-0.6B-GGUF/resolve/928ab958557df9aa2ef1c93e0e83c7ad0933fae2'
          New-Item -ItemType Directory -Force m | Out-Null
          curl.exe -sSL -o m\Qwen3-ASR-0.6B-Q8_0.gguf "$r/Qwen3-ASR-0.6B-Q8_0.gguf"
          curl.exe -sSL -o m\mmproj-Qwen3-ASR-0.6B-Q8_0.gguf "$r/mmproj-Qwen3-ASR-0.6B-Q8_0.gguf"
          Get-FileHash m\*.gguf | Format-List
      - name: Run llama-server like the app does
        run: |
          $exe = (Get-ChildItem inst -Recurse -Filter llama-server.exe | Select-Object -First 1).FullName
          "exe: $exe"
          Get-ChildItem (Split-Path $exe) | Format-Table Name,Length
          Set-Content key.txt 'testkey' -NoNewline
          $args = @('-m',"$PWD\m\Qwen3-ASR-0.6B-Q8_0.gguf",'--mmproj',"$PWD\m\mmproj-Qwen3-ASR-0.6B-Q8_0.gguf",'--host','127.0.0.1','--port','18080','--api-key-file',"$PWD\key.txt",'--no-webui','--jinja','-ngl','0','-c','4096','-np','1')
          $p = Start-Process -FilePath $exe -ArgumentList $args -RedirectStandardError err.txt -RedirectStandardOutput out.txt -PassThru -NoNewWindow
          $ok = $false
          for ($i=0; $i -lt 180; $i++) {
            Start-Sleep -Milliseconds 500
            if ($p.HasExited) { break }
            try { $r = Invoke-WebRequest -Uri http://127.0.0.1:18080/health -Headers @{Authorization='Bearer testkey'} -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ok=$true; break } } catch {}
          }
          "healthy: $ok  exited: $($p.HasExited)  code: $(if ($p.HasExited) { $p.ExitCode })"
          '--- stderr ---'; Get-Content err.txt -Tail 80
          '--- stdout ---'; Get-Content out.txt -Tail 40
          if (-not $p.HasExited) { Stop-Process $p -Force }
