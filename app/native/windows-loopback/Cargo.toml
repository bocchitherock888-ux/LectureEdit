[package]
name = "lectureedit-windows-loopback"
version = "0.1.2"
edition = "2021"
publish = false

[dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_Variant",
] }

[profile.release]
lto = "thin"
